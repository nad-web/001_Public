<!doctype html>
<html lang="fa-AF" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#234a3a">
  <meta name="description" content="بازی جفت‌کردن کارت‌ها به دری و فارسی؛ ده مرحله، منظرهٔ هاینبورگ و صدای فارسی. ساختهٔ نورالله عادل.">
  <meta name="application-name" content="باغ حافظهٔ هاینبورگ">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="باغ حافظه">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>باغ حافظهٔ هاینبورگ | نورالله عادل</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="preload" href="./assets/fonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">رفتن به محتوای اصلی</a>
  <header class="site-header">
    <a class="brand" href="#home" aria-label="خانهٔ باغ حافظهٔ هاینبورگ">
      <img src="./assets/icons/favicon.svg" width="48" height="48" alt="">
      <span><strong>باغ حافظه</strong><small>هاینبورگ · دری / فارسی</small></span>
    </a>
    <div class="header-actions">
      <button id="install-help" class="install-button" type="button"><span aria-hidden="true">⊕</span> افزودن به آیفون</button>
      <button id="sound-button" class="sound-button" type="button" aria-pressed="false" aria-label="روشن‌کردن صدای فارسی">صدا: خاموش</button>
    </div>
  </header>
  <div class="statusbar"><span id="offline-status" role="status">در حال بررسی امکان بازی آفلاین…</span><button id="retry-offline" type="button" hidden>بررسی دوباره</button><button id="update-app" type="button" hidden>دریافت نسخهٔ تازه</button></div>
  <div id="storage-warning" class="notice" role="status" hidden></div>
  <main id="main" tabindex="-1"></main>
  <footer class="site-footer"><span>ساختهٔ نورالله عادل</span><span id="version">نسخهٔ ۱.۱.۰</span><a href="#about">دربارهٔ بازی و منابع</a></footer>
  <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <noscript><p class="notice">برای اجرای بازی، جاوااسکریپت مرورگر را فعال کنید. به حساب کاربری نیازی ندارید.</p></noscript>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
